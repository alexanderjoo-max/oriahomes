<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 147.97 147.97">
  <!--
    Oria mark, tuned for favicon sizes. Same geometry as assets/mark.svg, with
    two changes: fills are inline rather than CSS classes (safer across icon
    parsers), and a base disc sits under the facets so anti-aliasing between
    them can never open a hairline seam at 16px.
  -->
