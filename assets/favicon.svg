      <stop offset="0" stop-color="#4f7b91"/>
      <stop offset="1" stop-color="#1f384b"/>
    </radialGradient>
    <radialGradient id="f3" cx="92.41" cy="130.96" fx="92.41" fy="130.96" r="70.69" xlink:href="#f2"/>
    <radialGradient id="f4" cx="94.06" cy="84.2" fx="94.06" fy="84.2" r="61.12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#da5f41"/>
      <stop offset="1" stop-color="#ba3d19"/>
    </radialGradient>
  </defs>

  <circle cx="73.98" cy="73.98" r="73.98" fill="url(#f2)"/>

